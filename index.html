<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedPowerScreen Pro</title>

    <style>
        :root {
            --bg: #05070a; --card: #111827; --accent: #06b6d4;
            --text: #f9fafb; --dim: #64748b; --danger: #ef4444; --warning: #f59e0b; --success: #10b981; --wa: #25d366;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 400px; background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid #1f2937; box-sizing: border-box; }
        .header h1 { font-size: 0.9rem; letter-spacing: 2px; text-align: center; color: var(--accent); margin: 0 0 12px 0; }
        
        .mode-switch { background: #000; padding: 3px; border-radius: 8px; display: flex; margin-bottom: 10px; border: 1px solid #1f2937; }
        .mode-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; background: transparent; color: var(--dim); cursor: pointer; font-size: 0.65rem; font-weight: bold; }
        .mode-btn.active { background: var(--accent); color: #000; }

        .main-display { background: #000; border: 1px solid var(--accent); padding: 12px; border-radius: 15px; text-align: center; margin-bottom: 10px; }
        .main-val { font-size: 2.2rem; font-weight: 800; color: #fff; background: transparent; border: none; text-align: center; width: 100%; outline: none; }
        
        .section { background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #1f2937; }
        label { font-size: 0.6rem; color: var(--dim); text-transform: uppercase; display: block; margin-bottom: 4px; }
        
        .compact-grid { display: grid; grid-template-columns: 1.8fr 0.8fr 0.8fr; gap: 8px; align-items: end; }
        .slim-input { background: #000; border: 1px solid #374151; color: #fff; padding: 6px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 0.9rem; text-align: center; }
        select { background: #000; border: 1px solid #374151; color: #fff; padding: 6px; border-radius: 6px; width: 100%; font-size: 0.75rem; outline: none; cursor: pointer; }
        
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
        
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .res-card { background: #000; padding: 8px; border-radius: 10px; border: 1px solid #1f2937; text-align: center; }
        .res-val { display: block; font-size: 1rem; font-weight: bold; }
        .res-lbl { font-size: 0.55rem; color: var(--dim); text-transform: uppercase; }
        .sub-val { font-size: 0.55rem; display: block; margin-top: 2px; }
        
        input[type=range] { width: 100%; accent-color: var(--accent); margin: 8px 0; cursor: pointer; }

        /* Estilos de Botón con Efecto de Presión */
        .btn-wa { 
            background: var(--wa); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-top: 12px; display: block; text-decoration: none; text-align: center; box-sizing: border-box;
            box-shadow: 0 4px 0 #1da851; transition: all 0.1s ease; position: relative; top: 0;
        }
        .btn-wa:active { top: 3px; box-shadow: 0 1px 0 #1da851; background-color: #20bd5b; }

        /* Estilos de la Firma */
        .firma { margin-top: 15px; text-align: center; }
        .divider { height: 1px; background: linear-gradient(to right, transparent, #374151, transparent); margin: 8px 0; }
        .firma p { font-size: 0.55rem; color: var(--dim); margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        .firma span { color: var(--accent); font-weight: 800; }
        .version { font-size: 0.47rem !important; opacity: 0.6; margin-top: 4px !important; }

        .text-success { color: var(--success) !important; }
        .text-warning { color: var(--warning) !important; }
        .text-danger { color: var(--danger) !important; }
        input, select { user-select: auto; }
    </style>
</head>
<body>

<div class="app">
    <div class="header"><h1>LedPOWER PRO</h1></div>

    <div class="mode-switch">
        <button class="mode-btn active" id="btnDim" onclick="setMode('dim')">MEDIDAS</button>
        <button class="mode-btn" id="btnQty" onclick="setMode('qty')">CANTIDAD</button>
    </div>

    <div class="main-display" id="mainBox">
        <span class="res-lbl" id="mainLbl" style="color:var(--accent)">Módulos Totales</span>
        <input type="number" class="main-val" id="resMod" value="0" oninput="calc()" readonly>
        <div id="resMatrix" style="font-size:0.65rem; color:var(--dim)">0 x 0 unidades</div>
    </div>

    <div id="sectionDim" class="section">
        <div class="input-row">
            <div style="flex:1"><label>Pantalla (m)</label><div style="display:flex; gap:4px; align-items:center"><input type="number" id="sw" class="slim-input" value="5" oninput="calc()"><span>x</span><input type="number" id="sh" class="slim-input" value="3" oninput="calc()"></div></div>
            <div style="flex:1"><label>Módulo (cm)</label><div style="display:flex; gap:4px; align-items:center"><input type="number" id="mw" class="slim-input" value="50" oninput="calc()"><span>x</span><input type="number" id="mh" class="slim-input" value="50" oninput="calc()"></div></div>
        </div>
    </div>

    <div class="section">
        <div class="compact-grid">
            <div>
                <label>Pitch / Modelo</label>
                <select id="pitch" onchange="calc()">
                    <option value="450">Fine P0.9-P1.5 (450W)</option>
                    <option value="600" selected>Indoor P1.8-P2.6 (600W)</option>
                    <option value="800">Indoor P3-P4 (800W)</option>
                    <option value="950">Outdoor P3.9-P4.8 (950W)</option>
                    <option value="1200">Outdoor P5-P10 (1200W)</option>
                    <option value="1500">Outdoor Max (1500W)</option>
                </select>
            </div>
            <div>
                <label>Volt</label>
                <select id="volt" onchange="calc()"><option value="110">110V</option><option value="220">220V</option></select>
            </div>
            <div>
                <label>Cable</label>
                <select id="mat" onchange="calc()"><option value="0.0172">Cu</option><option value="0.0282">AlCu</option></select>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="input-row">
            <div style="flex:2.5">
                <div style="display:flex; justify-content:space-between"><label>Brillo</label><span id="bval" style="color:var(--accent); font-weight:bold; font-size:0.8rem">100%</span></div>
                <input type="range" id="brillo" min="5" max="100" value="100" oninput="calc()">
            </div>
            <div style="flex:1">
                <label>Dist. (m)</label>
                <input type="number" id="dist" class="slim-input" value="80" oninput="calc()">
            </div>
        </div>
    </div>

    <div class="results-grid">
        <div class="res-card"><span class="res-val" id="resWatt">0W</span><span class="res-lbl">Consumo Watts</span></div>
        <div class="res-card">
            <span class="res-val" id="resBrk">0A</span>
            <span class="sub-val" id="resLive">LIVE: 0A</span>
            <span class="res-lbl">Breaker / Amps</span>
        </div>
        <div class="res-card"><span class="res-val" id="resCab">0</span><span class="res-lbl">Cable AWG</span></div>
        <div class="res-card">
            <span class="res-val" id="resDrop">0%</span>
            <span class="sub-val" id="resVPerdido">0.0V Perdidos</span>
            <span class="res-lbl">Caída Tensión</span>
        </div>
    </div>

    <a href="#" id="waLink" class="btn-wa">ENVIAR REPORTE</a>

    <div class="firma">
        <div class="divider"></div>
        <p>Desarrollado por <span>15C0</span></p>
        <p class="version">v1.5 | 2026</p>
    </div>
</div>

<script>
let currentMode = 'dim';

function setMode(m) {
    currentMode = m;
    const resMod = document.getElementById('resMod');
    const mainBox = document.getElementById('mainBox');
    const sectionDim = document.getElementById('sectionDim');
    const btnDim = document.getElementById('btnDim');
    const btnQty = document.getElementById('btnQty');

    if(m === 'qty') {
        resMod.readOnly = false;
        mainBox.style.background = "#111827"; 
        sectionDim.style.display = "none";
        btnQty.classList.add('active');
        btnDim.classList.remove('active');
        document.getElementById('mainLbl').innerText = "Ingrese Cantidad";
    } else {
        resMod.readOnly = true;
        mainBox.style.background = "#000";
        sectionDim.style.display = "block";
        btnDim.classList.add('active');
        btnQty.classList.remove('active');
        document.getElementById('mainLbl').innerText = "Módulos Totales";
    }
    calc();
}

function calc() {
    const mw = (parseFloat(document.getElementById('mw').value) || 50) / 100;
    const mh = (parseFloat(document.getElementById('mh').value) || 50) / 100;
    const pW = parseInt(document.getElementById('pitch').value) || 600;
    const brillo = parseInt(document.getElementById('brillo').value) || 100;
    const volt = parseInt(document.getElementById('volt').value) || 110;
    const dist = parseFloat(document.getElementById('dist').value) || 0;
    const rho = parseFloat(document.getElementById('mat').value) || 0.0172;
    
    document.getElementById('bval').innerText = brillo + "%";

    let totalMods = 0;
    let areaTotal = 0;

    if(currentMode === 'dim') {
        const sw = parseFloat(document.getElementById('sw').value) || 0;
        const sh = parseFloat(document.getElementById('sh').value) || 0;
        const modsH = Math.ceil(sw / mw) || 0;
        const modsV = Math.ceil(sh / mh) || 0;
        totalMods = modsH * modsV;
        areaTotal = totalMods * (mw * mh);
        document.getElementById('resMod').value = totalMods;
        document.getElementById('resMatrix').innerText = `${modsH} x ${modsV} unidades`;
    } else {
        totalMods = parseInt(document.getElementById('resMod').value) || 0;
        areaTotal = totalMods * (mw * mh);
        document.getElementById('resMatrix').innerText = "Modo Edición Manual";
    }

    const wMax = areaTotal * pW;
    const wReal = wMax * (brillo / 100);
    const ampReal = wReal / volt;
    const ampSecurity = (wMax / volt) * 1.25;

    let b = 15, c = 14, sec = 2.08;
    if(ampSecurity > 15) { b=20; c=12; sec=3.31; }
    if(ampSecurity > 20) { b=30; c=10; sec=5.26; }
    if(ampSecurity > 30) { b=40; c=8; sec=8.36; }
    if(ampSecurity > 50) { b=60; c=6; sec=13.3; }

    const vDrop = (2 * dist * ampReal * rho) / sec;
    const pDrop = (volt > 0) ? (vDrop / volt) * 100 : 0;

    document.getElementById('resWatt').innerText = Math.round(wReal) + "W";
    document.getElementById('resBrk').innerText = b + "A";
    document.getElementById('resLive').innerText = `LIVE: ${ampReal.toFixed(1)}A`;
    document.getElementById('resDrop').innerText = pDrop.toFixed(1) + "%";
    document.getElementById('resVPerdido').innerText = vDrop.toFixed(1) + "V Perdidos";
    document.getElementById('resCab').innerText = "#" + c + " AWG";

    const msg = `⚡ *REPORTE LED POWER* ⚡
--------------------------
📦 MODULOS: ${totalMods}
🔅 BRILLO: ${brillo}%
🔌 VOLTAJE: ${volt}V

🔥 CONSUMO: ${Math.round(wReal)}W
🔋 AMPERAJE: ${ampReal.toFixed(1)}A
🛠️ BREAKER: ${b}A
🧵 CABLE: #${c} AWG
📏 DISTANCIA: ${dist}m
📉 CAIDA V: ${pDrop.toFixed(1)}% (${vDrop.toFixed(1)}V)
--------------------------`;

    const waBtn = document.getElementById('waLink');
    waBtn.onclick = function(e) {
        e.preventDefault();
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
            window.location.href = "whatsapp://send?text=" + encodeURIComponent(msg);
        } else {
            window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(msg), '_blank');
        }
    };
}

calc();
</script>
</body>
</html>
